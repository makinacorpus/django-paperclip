[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperclip"
version = "2.7.4"
description = "Attach files to Django models"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [
    { name = "Makina Corpus", email = "geobi@makina-corpus.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Topic :: Utilities",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "Django",
    "pillow",
    "easy-thumbnails",
    "django-embed-video",
    "python-magic",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/makinacorpus/django-paperclip"
Download = "https://pypi.python.org/pypi/paperclip/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["paperclip*"]

[tool.ruff]
target-version = "py311"
exclude = [
    "paperclip/migrations",
    "test_project/test_app/migrations",
]

[tool.ruff.lint]
select = ["G", "INT", "E4", "E7", "E9", "F", "DJ", "LOG", "UP", "I", "T10", "EM", "T201"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.coverage.run]
source = ["paperclip"]
